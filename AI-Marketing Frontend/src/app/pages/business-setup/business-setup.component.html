<div class="auth-page"><a class="auth-brand" routerLink="/"><span>✳</span> crumbwise<span class="brand-dot">.</span></a><div class="auth-layout"><section class="auth-story"><span class="section-kicker">YOUR BUSINESS</span><h1>Every great<br>story starts<br><em>somewhere.</em></h1><p>Tell us about your business so your workspace can focus on the things that matter to you.</p><div class="story-note">✦ &nbsp; You can add more businesses later.</div></section><section class="auth-card"><span class="section-kicker">BUSINESS SETUP</span><h2>Meet your business.</h2><p class="auth-subtitle">These details are saved to your account in the backend.</p><form [formGroup]="form" (ngSubmit)="submit()"><label>Business name<input formControlName="name" placeholder="e.g. Fresh Bake House"></label><label>Business category<select formControlName="category"><option value="Bakery">Bakery</option><option value="Restaurant">Restaurant</option><option value="Retail">Retail / Shop</option><option value="Other">Other</option></select></label><label>Business email<input formControlName="email" type="email" placeholder="business@example.com"></label><label>Contact phone<input formControlName="phone" type="tel" placeholder="+91…"></label><label>Street address<input formControlName="address" placeholder="Street / area"></label><label>City<input formControlName="city" placeholder="e.g. Kolhapur"></label><label>State<input formControlName="state" placeholder="e.g. Maharashtra"></label><label>Country<input formControlName="country" placeholder="India"></label><label>PIN code<input formControlName="pincode" placeholder="416001"></label><label>Website <span class="optional">(optional)</span><input formControlName="website" type="url" placeholder="https://example.com"></label><label>Description <span class="optional">(optional)</span><input formControlName="description" placeholder="What does your business do?"></label><p class="form-error" *ngIf="error">{{error}}</p><button class="auth-submit" type="submit" [disabled]="loading">{{loading ? 'Creating workspace…' : 'Create business workspace'}} <span>↗</span></button></form></section></div></div>
