<!-- Navigation Header -->
<header class="app-navbar py-3 sticky-top">
  <div class="container-fluid px-lg-5 d-flex align-items-center justify-content-between">
    
    <!-- Branding logo -->
    <a routerLink="/" class="navbar-brand-custom d-flex align-items-center text-decoration-none">
      <span class="material-icons logo-icon me-2">hub</span>
      <div class="logo-text-group">
        <span class="logo-primary fw-bold text-uppercase">Aether</span>
        <span class="logo-secondary text-muted d-block small">AI Multi-Agent Team</span>
      </div>
    </a>

    <!-- Nav Links (Desktop) -->
    <nav class="d-none d-md-flex align-items-center gap-4">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item-link text-decoration-none">Home</a>
      <a routerLink="/workspace" routerLinkActive="active" class="nav-item-link text-decoration-none">Workspace</a>
      <a routerLink="/analytics" routerLinkActive="active" class="nav-item-link text-decoration-none">Analytics</a>
    </nav>

    <!-- Right Side Actions (Desktop) -->
    <div class="d-none d-md-flex align-items-center gap-3">
      <ng-container *ngIf="authService.currentUser() as user; else loginBtn">
        
        <!-- User account dropdown menu -->
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-profile-trigger d-flex align-items-center gap-2">
          <div class="avatar-wrapper shadow-sm">
            <img [src]="user.avatar" [alt]="user.name">
          </div>
          <div class="text-start d-none d-lg-block">
            <span class="d-block fw-bold profile-name">{{ user.name }}</span>
            <small class="text-muted d-block profile-role">{{ user.role }}</small>
          </div>
          <span class="material-icons text-muted">expand_more</span>
        </button>

        <mat-menu #userMenu="matMenu" xPosition="before" class="custom-user-menu">
          <div class="px-3 py-2 border-bottom">
            <span class="d-block fw-bold">{{ user.name }}</span>
            <small class="text-muted d-block">{{ user.email }}</small>
          </div>
          <a mat-menu-item routerLink="/workspace">
            <mat-icon class="text-terracotta">dashboard</mat-icon>
            <span>Agent Workspace</span>
          </a>
          <a mat-menu-item routerLink="/analytics">
            <mat-icon class="text-amber">analytics</mat-icon>
            <span>Analytics Dashboard</span>
          </a>
          <hr class="my-1">
          <button mat-menu-item (click)="logout()">
            <mat-icon class="text-muted">logout</mat-icon>
            <span>Sign Out</span>
          </button>
        </mat-menu>

      </ng-container>

      <ng-template #loginBtn>
        <a routerLink="/login" class="btn premium-btn-primary py-2 px-4">
          Access Platform
        </a>
      </ng-template>
    </div>

    <!-- Mobile Navigation Toggle Button -->
    <button mat-icon-button class="d-md-none text-terracotta" (click)="toggleMobileMenu()">
      <mat-icon>{{ isMobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>

  </div>
</header>

<!-- Mobile Navigation Drawer Overlay -->
<div class="mobile-drawer-overlay d-md-none" *ngIf="isMobileMenuOpen" (click)="toggleMobileMenu()"></div>

<!-- Mobile Navigation Drawer -->
<div class="mobile-drawer d-md-none" [class.open]="isMobileMenuOpen">
  <div class="drawer-header p-4 border-bottom d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center">
      <span class="material-icons text-terracotta me-2">hub</span>
      <span class="fw-bold fs-5 text-uppercase">Aether</span>
    </div>
    <button mat-icon-button (click)="toggleMobileMenu()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="drawer-body p-4">
    <div class="d-flex flex-column gap-3">
      <a routerLink="/" (click)="toggleMobileMenu()" class="mobile-nav-link">Home</a>
      <a routerLink="/workspace" (click)="toggleMobileMenu()" class="mobile-nav-link">Agent Workspace</a>
      <a routerLink="/analytics" (click)="toggleMobileMenu()" class="mobile-nav-link">Analytics Dashboard</a>
      
      <hr class="my-3">

      <!-- Mobile Session Controls -->
      <ng-container *ngIf="authService.currentUser() as user; else mobileLogin">
        <div class="d-flex align-items-center gap-3 p-2 bg-light rounded mb-3">
          <img [src]="user.avatar" [alt]="user.name" class="rounded-circle" style="width: 44px; height: 44px; border: 1px solid var(--border-color);">
          <div>
            <span class="d-block fw-bold">{{ user.name }}</span>
            <small class="text-muted d-block" style="font-size: 0.75rem;">{{ user.role }}</small>
          </div>
        </div>
        <button class="btn btn-outline-danger w-100 py-2 rounded-pill" (click)="logout()">
          Sign Out
        </button>
      </ng-container>
      
      <ng-template #mobileLogin>
        <a routerLink="/login" (click)="toggleMobileMenu()" class="btn premium-btn-primary w-100 py-2">
          Access Platform
        </a>
      </ng-template>
    </div>
  </div>
</div>

<!-- Main Application Routing Content -->
<main class="main-content-layout">
  <router-outlet></router-outlet>
</main>
